name: Rust

on:
  push:
    branches: [ "main","dev" ]
  pull_request:
    branches: [ "main","dev" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # The build-check tests look up older commits in git history
        fetch-depth: 0
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Test with the SQLite cache feature
      run: cargo test --verbose --features cache
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Run build-check tests
      run: node --test test/test-engine-build-check.mjs
    - name: Check a panic becomes a JS error
      run: node --test test/test-panic-to-js-error.mjs
    - name: Check the change log
      run: node --test test/test-check-change-log.mjs

  deny:
    # Change-log S8: advisories, licences, bans and sources on every pull request.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check
