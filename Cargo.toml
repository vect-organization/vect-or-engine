[package]
name = "vect_or_engine"
version = "0.3.14"
edition = "2021"
rust-version = "1.88"
authors = ["1abcdefggs"]
description = "High-performance vector search (HNSW) and semantic validation engine in Rust"
license = "MIT"
repository = "https://github.com/1abcdefggs/vect-or-engine"
readme = "README.md"

[lib]
name = "vect_or_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vect_or_engine_cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The headless CLI is the only code that needs the full tokio feature set.
cli = ["dep:tokio", "tokio/macros", "tokio/io-util", "tokio/io-std"]
napi = ["dep:napi", "dep:napi-derive", "dep:tokio"]
# SQLite cache (save/load of a warm-start file). Off by default so the default build carries no
# SQLite code (S3); the npm build turns it on.
cache = ["dep:rusqlite"]
# Exports a function that panics on purpose, for the S5 Node test. Not for release builds.
test-hooks = ["napi"]

[dependencies]
# N-API bindings (only with --features napi; the CLI and CI cargo builds stay free of napi_* symbols)
napi = { version = "2", optional = true, default-features = false, features = ["napi4", "tokio_rt", "serde-json"] }
napi-derive = { version = "2", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", optional = true, features = ["sync", "rt", "rt-multi-thread"] }
aho-corasick = "1.1"
half = "2.4"
rayon = "1.10"
regex = "1.10"
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
thiserror = "2"
unicode-normalization = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
