# cargo-deny configuration (change-log S8). Run: cargo deny check
# Not run in this repository's authoring environment (tool not installed there); the first CI run is the check.

[graph]
# Dependencies of the published targets only.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
# Known vulnerabilities and unmaintained crates fail the check.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# The crate is MIT; allow only permissive licences for dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
